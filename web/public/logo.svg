<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="POS logo">
  <defs>
    <!-- MASTER band: #047857 → #6EE7B7 → #4ADE80, deepened so the white mark keeps its contrast. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <ellipse cx="256" cy="120" rx="210" ry="120" fill="url(#shine)"/>

  <!-- Receipt: rounded top, zigzag tear at the bottom -->
  <path fill="#FFFFFF" d="
    M168 112
    h176
    a24 24 0 0 1 24 24
    v262
    l-24 -18 l-24 18 l-24 -18 l-24 18 l-24 -18 l-24 18 l-24 -18 l-24 18 l-24 -18
    V136
    a24 24 0 0 1 24 -24 Z"/>

  <!-- Lines on the receipt -->
  <rect x="190" y="160" width="132" height="18" rx="9" fill="#047857" opacity="0.35"/>
  <rect x="190" y="200" width="96" height="18" rx="9" fill="#047857" opacity="0.35"/>

  <!-- Total row -->
  <rect x="190" y="252" width="132" height="4" rx="2" fill="#047857" opacity="0.25"/>
  <rect x="190" y="280" width="52" height="22" rx="11" fill="#047857" opacity="0.55"/>
  <rect x="262" y="276" width="60" height="30" rx="15" fill="#15803D"/>

  <!-- Paid check -->
  <circle cx="356" cy="356" r="60" fill="#FFFFFF"/>
  <circle cx="356" cy="356" r="48" fill="#15803D"/>
  <path d="M333 357 l15 15 l29 -31" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
